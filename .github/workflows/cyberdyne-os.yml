name: Build Cyberdyne OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "cyberdyne-os/**"
      - ".github/workflows/cyberdyne-os.yml"

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso mtools dosfstools \
            grub-pc-bin grub-efi-amd64-bin grub-common
      - name: Build ISO
        working-directory: cyberdyne-os
        run: sudo ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cyberdyne-os-iso
          path: cyberdyne-os/out/
          compression-level: 0
          retention-days: 14
