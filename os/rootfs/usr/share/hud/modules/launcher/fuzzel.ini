# Written by hudctl from the active theme.
[main]
font={{font_mono}}:size=12
prompt="SEARCH > "
terminal={{terminal}} -e
icons-enabled=yes
icon-theme={{icon_theme}}
width=46
lines=9
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=24

[colors]
background={{bg_hex}}f2
text={{text_hex}}ff
prompt={{line_hex}}ff
input={{title_hex}}ff
match={{alert_hex}}ff
selection={{line_hex}}ff
selection-text={{bg_hex}}ff
selection-match={{bg_hex}}ff
border={{line_hex}}ff

[border]
width=1
radius={{radius}}
