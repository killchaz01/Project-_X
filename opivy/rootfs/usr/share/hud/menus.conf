# The menu bar's File, Edit, View, Window and Help menus.
# One item per line:   app | menu | label | action
#   app     an app id (foot, thunar, mousepad ...), "*" for any app,
#           or "desktop" for when no app is in front
#   action  the keys the app uses for it (ctrl+n, ctrl+shift+s, F11 ...),
#           or @minimize @hide @front @quit, or @run:COMMAND
# An app with its own lines for a menu gets only those; others get "*".
# Add lines of your own in ~/.config/hud/menus.conf.

* | file | New | ctrl+n
* | file | Open... | ctrl+o
* | file | Save | ctrl+s
* | file | Save As... | ctrl+shift+s
* | file | Print... | ctrl+p
* | file | Close Window | cmd+w

* | edit | Undo | ctrl+z
* | edit | Redo | ctrl+shift+z
* | edit | Cut | ctrl+x
* | edit | Copy | ctrl+c
* | edit | Paste | ctrl+v
* | edit | Select All | ctrl+a
* | edit | Find... | ctrl+f

* | view | Zoom In | ctrl+plus
* | view | Zoom Out | ctrl+minus
* | view | Actual Size | ctrl+0
* | view | Enter Full Screen | cmd+ctrl+f

* | window | Minimise | @minimize
* | window | Zoom | cmd+Up
* | window | Hide | @hide
* | window | Bring All to Front | @front

* | help | Op Ivy Help | @run:mousepad /usr/share/hud/help.txt
* | help | Hardware Check | @run:foot -H hud-hwcheck
* | help | About This Computer | @run:foot -H hud

# Terminal
foot | file | New Window | ctrl+shift+n
foot | file | Close Window | cmd+w
foot | edit | Copy | ctrl+shift+c
foot | edit | Paste | ctrl+shift+v
foot | edit | Find... | ctrl+shift+r
foot | view | Bigger Text | ctrl+plus
foot | view | Smaller Text | ctrl+minus
foot | view | Normal Text | ctrl+0
foot | view | Enter Full Screen | cmd+ctrl+f

# Files
thunar | file | New Window | ctrl+n
thunar | file | New Tab | ctrl+t
thunar | file | New Folder | ctrl+shift+n
thunar | file | Get Info | alt+Return
thunar | file | Rename | F2
thunar | file | Move to Trash | Delete
thunar | file | Close Window | cmd+w
thunar | view | As Icons | ctrl+1
thunar | view | As List | ctrl+2
thunar | view | As Compact List | ctrl+3
thunar | view | Show Hidden Files | ctrl+h
thunar | view | Reload | ctrl+r
thunar | view | Enter Full Screen | cmd+ctrl+f

# Web
epiphany | file | New Window | ctrl+n
epiphany | file | New Tab | ctrl+t
epiphany | file | New Private Window | ctrl+shift+n
epiphany | file | Open Location... | ctrl+l
epiphany | file | Save Page As... | ctrl+s
epiphany | file | Print... | ctrl+p
epiphany | file | Close Tab | ctrl+w
epiphany | view | Reload | ctrl+r
epiphany | view | Zoom In | ctrl+plus
epiphany | view | Zoom Out | ctrl+minus
epiphany | view | Actual Size | ctrl+0
epiphany | view | Enter Full Screen | cmd+ctrl+f

# Nothing in front
desktop | file | New Files Window | @run:thunar
desktop | file | New Terminal Window | @run:foot
desktop | file | New Folder on Desktop | @run:mkdir -p "$(xdg-user-dir DESKTOP)/untitled folder"
desktop | view | Change Theme | @run:hud-menu theme
desktop | view | Control Center | @run:hud-center prefs
desktop | window | Application Center | @run:hud-center apps
desktop | help | Op Ivy Help | @run:mousepad /usr/share/hud/help.txt
desktop | help | Hardware Check | @run:foot -H hud-hwcheck
desktop | help | About This Computer | @run:foot -H hud
