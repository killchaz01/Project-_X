# Defaults for every setting. Do not edit this file: override any key with
#   hudctl set KEY VALUE        (stored in ~/.config/hud/settings.conf)
# Colours come from the active theme (themes/*.conf), not from here.

# --- fonts ---
font_ui        = Michroma
font_mono      = JetBrains Mono
font_size      = 9

# --- icons ---
# HUD draws folders and files in the theme colours. Or any installed set:
# Papirus-Dark, Papirus, Papirus-Light, Adwaita
icon_theme     = HUD
# The set that HUD's own folder and file icons fall back to.
icon_base      = Papirus-Dark

# --- frames ---
# Corner size, line thickness, and the glow around lines (0 to 3).
radius         = 0
border_width   = 2
gap            = 6
glow           = yes
glow_strength  = 1
scanlines      = yes

# --- shapes ---
# The outline used by each group of blocks. Choices:
#   square octagon round cut tab hex slant pill bracket hexagon
shape_menu     = square
shape_hardware = square
shape_prefs    = square
shape_clock    = octagon
shape_dock     = square
shape_button   = square

# --- menu bar ---
bar_position   = top
bar_height     = 38
bar_opacity    = 0.96
# Text size on the menu bar; smaller than font_size so the blocks fit.
bar_font_size  = 8
# Blocks shown on each side, in order. Available: custom/menu custom/title
# tray clock group/hardware group/prefs custom/search, or any single block
# named below.
bar_left       = custom/menu,custom/title,custom/m-file,custom/m-edit,custom/m-view,custom/m-window,custom/m-help
bar_center     =
# A Mac menu bar shows no processor or memory read-outs; the console desktop
# has them. Add group/hardware here to show them in the bar too.
bar_right      = tray,group/prefs,custom/kbd,custom/search,clock
# Hardware read-outs. Available: cpu memory temperature disk network#speed
# cpu#load battery
bar_hardware   = cpu,memory,network#speed
# System preference blocks; click one to change that setting. Available:
# network bluetooth backlight wireplumber battery custom/alerts custom/theme
# custom/display custom/prefs custom/power
bar_prefs      = network,bluetooth,backlight,wireplumber,battery,custom/prefs
# Like the Mac: Sun Nov 15  05:43 PM. For a 24-hour clock: %a %b %d  %H:%M
clock_format   = %a %b %d  %I:%M %p
# Text on the menu button. Empty means the system name.
logo_text      =

# --- dock ---
dock_position  = bottom
dock_icon_size = 30
# mac = works like the Mac dock (running marks, Trash, right-click menu);
# icons = app icons only; labels = numbered word keys
dock_style     = mac
# Override an icon: LABEL:icon-name or LABEL:/path/to/file, comma separated.
dock_icons     =
# With dock_style = labels: number each tile and give it a split-square marker.
dock_numbers   = yes
# Pinned launchers as LABEL:command, comma separated.
dock_apps      = APPS:hud-center apps,TERM:foot,FILES:thunar,WEB:epiphany,EDIT:mousepad,SCAN:foot -H hud

# --- windows ---
# left = close/minimise/zoom on the left like macOS; right = on the right
window_buttons = left
# A halo in the frame colour around each window. Off by default: without
# a graphics chip (in most virtual machines) it draws as a flat band.
window_shadows = no
natural_scroll = yes

# --- keyboard ---
# The layout in use, and the ones offered in the menu bar (the layout block
# shows when there is more than one; Ctrl+Space steps through them).
keyboard_layout  = us
keyboard_layouts = us
tap_to_click   = yes

# --- wallpaper ---
# "generated" draws the station console from the theme colours; or a file path
wallpaper      = generated
# console = the station console (live, clickable panels); calm = quiet grid
wallpaper_style = console
# Keep the console's read-outs live and its panels clickable (hud-console).
console_live   = yes
# Glow on the live console. Costs processor time without a graphics chip.
console_glow   = no
wallpaper_seed = 14

# --- apps ---
terminal       = foot
lock_after     = 600
