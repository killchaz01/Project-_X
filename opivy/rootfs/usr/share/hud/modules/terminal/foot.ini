# Written by hudctl from the active theme.
[main]
font={{font_mono}}:size={{font_size}}
pad=12x10

[cursor]
style=block
blink=yes

[key-bindings]
# Cmd+C and Cmd+V copy and paste, as on a Mac (Ctrl+Shift+C/V still work).
clipboard-copy=Control+Shift+c XF86Copy Mod4+c
clipboard-paste=Control+Shift+v XF86Paste Mod4+v

[colors]
alpha=0.94
background={{bg_hex}}
foreground={{text_hex}}
selection-background={{line_hex}}
selection-foreground={{bg_hex}}
regular0={{term_0_hex}}
regular1={{term_1_hex}}
regular2={{term_2_hex}}
regular3={{term_3_hex}}
regular4={{term_4_hex}}
regular5={{term_5_hex}}
regular6={{term_6_hex}}
regular7={{term_7_hex}}
bright0={{term_8_hex}}
bright1={{term_9_hex}}
bright2={{term_10_hex}}
bright3={{term_11_hex}}
bright4={{term_12_hex}}
bright5={{term_13_hex}}
bright6={{term_14_hex}}
bright7={{term_15_hex}}
