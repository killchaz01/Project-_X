# Boot menu of the live ISO. @...@ markers are filled in by build.sh.
set default=0
set timeout=5

set color_normal=light-red/black
set menu_color_normal=red/black
set menu_color_highlight=black/red

menuentry "@PRETTY@" {
    linux  /live/vmlinuz boot=live @PALETTE@
    initrd /live/initrd.img
}
menuentry "@PRETTY@  (run from memory, medium can be removed)" {
    linux  /live/vmlinuz boot=live toram @PALETTE@
    initrd /live/initrd.img
}
menuentry "@PRETTY@  (safe graphics)" {
    linux  /live/vmlinuz boot=live nomodeset @PALETTE@
    initrd /live/initrd.img
}
