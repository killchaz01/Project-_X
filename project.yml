# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: EverStrong
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # set to your Apple Developer Team ID
targets:
  EverStrong:
    type: application
    platform: iOS
    sources:
      - path: EverStrong
    info:
      path: EverStrong/Info.plist
      properties:
        CFBundleDisplayName: EverStrong
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "EverStrong uses the camera to check your exercise form. Video is analysed on your iPhone and is never recorded or uploaded."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.everstrong   # change to your own reverse-domain ID
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  EverStrongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EverStrongTests
    dependencies:
      - target: EverStrong
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EverStrong:
    build:
      targets:
        EverStrong: all
    test:
      targets:
        - EverStrongTests
